name: Deploy Dashboard to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard data
        run: |
          # Validate scan-results.json exists and is valid JSON with required schema
          SCAN_RESULTS="docs/_data/scan-results.json"

          if [[ ! -f "$SCAN_RESULTS" ]]; then
            echo "Error: $SCAN_RESULTS not found"
            exit 1
          fi

          # Validate JSON syntax
          jq empty "$SCAN_RESULTS" || {
            echo "Error: $SCAN_RESULTS is not valid JSON"
            exit 1
          }

          # Validate required top-level fields
          jq -e 'has("scan_date") and has("summary") and has("operators")' "$SCAN_RESULTS" > /dev/null || {
            echo "Error: $SCAN_RESULTS missing required fields (scan_date, summary, operators)"
            exit 1
          }

          # Validate summary has required fields
          jq -e '.summary | has("total_operators") and has("pass") and has("partial") and has("none") and has("error") and has("mlkem_percent")' "$SCAN_RESULTS" > /dev/null || {
            echo "Error: summary in $SCAN_RESULTS missing required fields"
            exit 1
          }

          # Validate operators is an array
          jq -e '.operators | type == "array"' "$SCAN_RESULTS" > /dev/null || {
            echo "Error: operators in $SCAN_RESULTS must be an array"
            exit 1
          }

          echo "✓ Dashboard data validation passed"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
