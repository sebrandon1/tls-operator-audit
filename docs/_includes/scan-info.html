<div class="scan-info">
  <span>Scanned: <strong>{{ include.scan_date | date: "%Y-%m-%d" }}</strong></span>
  <span>Cluster: <strong>{{ include.cluster }}</strong></span>
  <span><span data-tooltip="OpenShift Container Platform">OCP</span>: <strong>{{ include.ocp_version }}</strong></span>
  {% if include.tco_version and include.tco_version != "" %}
  <span><span data-tooltip="tls-compliance-operator">TCO</span>: <strong>{{ include.tco_version }}</strong></span>
  {% endif %}
</div>
