<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="{{ '/' | relative_url }}">TLS Operator Audit</a>
      </div>
      <nav class="sidebar-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}>
          <span class="nav-icon">&#9632;</span> Operators
        </a>
        <a href="{{ '/endpoints' | relative_url }}" {% if page.url == '/endpoints' or page.url == '/endpoints.html' or page.url == '/endpoints/' %}class="active"{% endif %}>
          <span class="nav-icon">&#9679;</span> Endpoints
        </a>
        <a href="{{ '/history' | relative_url }}" {% if page.url == '/history' or page.url == '/history.html' or page.url == '/history/' %}class="active"{% endif %}>
          <span class="nav-icon">&#9201;</span> History
        </a>
        <a href="{{ '/versions' | relative_url }}" {% if page.url == '/versions' or page.url == '/versions.html' or page.url == '/versions/' %}class="active"{% endif %}>
          <span class="nav-icon">&#9881;</span> Versions
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light theme">
          <span class="theme-icon-light">&#9790;</span>
          <span class="theme-icon-dark">&#9788;</span>
        </button>
        <a href="https://github.com/sebrandon1/tls-operator-audit" target="_blank" rel="noopener" class="sidebar-github">GitHub</a>
      </div>
    </aside>

    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>

    <main class="content">
      {{ content }}
    </main>
  </div>

  <script src="{{ '/assets/js/sort.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/filters.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/export.js' | relative_url }}"></script>
  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'd') toggleTheme();
      if (e.key === '/') {
        e.preventDefault();
        var s = document.getElementById('table-search');
        if (s) s.focus();
      }
    });
    (function() {
      var toggle = document.getElementById('sidebar-toggle');
      var sidebar = document.getElementById('sidebar');
      if (toggle && sidebar) {
        toggle.addEventListener('click', function() {
          sidebar.classList.toggle('open');
        });
        document.addEventListener('click', function(e) {
          if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== toggle) {
            sidebar.classList.remove('open');
          }
        });
      }
    })();
  </script>
</body>
</html>
