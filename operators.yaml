  - name: rhods-operator
    jira: RHOAIENG-72334
    project: Red Hat OpenShift AI
    namespaces:
      - redhat-ods-operator
      - redhat-ods-applications

  - name: skupper-operator
    jira: CONNLINK-1122
    project: Red Hat Connectivity Link
    namespaces:
      - skupper

  - name: spire-operator
    jira: SPIRE-568
    project: SPIRE / Zero Trust Workload Identity
    namespaces:
      - spire-operator

  - name: external-secrets-operator
    jira: ESO-537
